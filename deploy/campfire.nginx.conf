server {
    listen 80;
    server_name campfire.dawoai.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name campfire.dawoai.com;
    ssl_certificate /etc/nginx/ssl/campfire.dawoai.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/campfire.dawoai.com/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 110m;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        proxy_pass http://127.0.0.1:8018;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location /files/ {
        proxy_pass http://127.0.0.1:8018;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location = /health { proxy_pass http://127.0.0.1:8018; }
    # Server-rendered public content; preserve SPA routes and asset directory.
    location = / { proxy_pass http://127.0.0.1:8018; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location = /search { proxy_pass http://127.0.0.1:8018; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location = /business { proxy_pass http://127.0.0.1:8018; }
    location = /about { proxy_pass http://127.0.0.1:8018; }
    location = /privacy { proxy_pass http://127.0.0.1:8018; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8018; }
    location = /robots.txt { proxy_pass http://127.0.0.1:8018; }
    location /shop/ { proxy_pass http://127.0.0.1:8018; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    root /opt/campfire/current/frontend/dist;
    # The material-library route shares its name with Vite's static directory.
    location = /assets { rewrite ^ /index.html last; }
    location = /assets/ { rewrite ^ /index.html last; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
