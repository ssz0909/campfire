[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiops-backend"
version = "0.1.0"
description = "AI Operations SaaS Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "email-validator==2.3.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.12",
    "celery==5.4.0",
    "redis==5.1.1",
    "httpx==0.27.2",
    "boto3==1.35.36",
    "pillow==10.4.0",
    "python-magic==0.4.27",
    "langgraph==0.2.34",
    "langchain-core==0.3.12",
    "langchain-openai==0.2.3",
    "psycopg2-binary>=2.9.9",
    "aiofiles>=24.1.0",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov>=5.0.0",
    "httpx==0.27.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
